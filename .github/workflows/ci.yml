name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.11"
  PYTHONHASHSEED: "0"
  TZ: "UTC"
  LC_ALL: "C.UTF-8"

jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create locked virtual environment
        run: uv sync --locked --dev
      - name: Lint
        run: make lint
      - name: Compile and test
        run: make verify
      - name: Check repository hygiene
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          ! rg -n --hidden --glob '!position.md' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' .
      - name: Upload offline evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-evaluation-${{ github.sha }}
          path: build/offline-eval.json
          if-no-files-found: error
          retention-days: 30

  planning-api-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build planning API image
        run: docker build --pull=false --tag otc-agent-api:test .
      - name: Exercise planning API endpoints
        run: |
          docker run --detach --rm --publish 127.0.0.1:18080:8080 --name otc-agent-api-smoke otc-agent-api:test
          trap 'docker stop otc-agent-api-smoke >/dev/null 2>&1 || true' EXIT
          healthy=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/healthz; then
              healthy=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' otc-agent-api-smoke 2>/dev/null | grep --quiet true; then
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker logs otc-agent-api-smoke 2>&1 || true
            exit 1
          fi
          curl --fail --silent --max-time 5 \
            --header 'Content-Type: application/json' \
            --data '{"service":"apigw","kind":"feature","description":"smoke test"}' \
            http://127.0.0.1:18080/v1/plans > /tmp/plan.json
          python3 -c 'import json; assert json.load(open("/tmp/plan.json"))["mapping"]["docs"] == "api-gateway"'
