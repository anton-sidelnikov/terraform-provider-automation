name: Online evaluation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-evaluation
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.11"
  PYTHONHASHSEED: "0"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: online-evaluation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked evaluation dependencies
        run: uv sync --locked
      - name: Evaluate the deployed service
        env:
          OTC_AGENT_EVAL_URL: ${{ vars.OTC_AGENT_EVAL_URL }}
        run: make online-eval
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: online-evaluation-${{ github.run_id }}
          path: build/online-eval.json
          if-no-files-found: error
          retention-days: 90
