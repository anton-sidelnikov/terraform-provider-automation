name: Generate SDK pull request

on:
  workflow_dispatch:
    inputs:
      docs_repository:
        description: Exact repository slug in opentelekomcloud-docs
        required: true
        type: string
      service_key:
        description: Optional reviewed abbreviation; auto-proposed for an unmapped service
        required: false
        type: string
      description:
        description: Describe the API change; kind is classified automatically
        required: true
        type: string
      issue_url:
        description: Optional github.com issue URL
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-change-${{ inputs.docs_repository }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.11"
  GO_VERSION: "1.23"
  PYTHONHASHSEED: "0"

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sdk: ${{ steps.fields.outputs.sdk }}
      provider: ${{ steps.fields.outputs.provider }}
      docs: ${{ steps.fields.outputs.docs }}
      kind: ${{ steps.fields.outputs.kind }}
      bootstrap: ${{ steps.fields.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: automation/uv.lock
      - name: Install locked automation dependencies
        run: uv sync --project automation --locked
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Create locked virtual environment
        run: uv sync --locked --dev
      - name: Run credential-free gates
        run: make check
      - name: Classify and create immutable plan
        env:
          REQUEST_SERVICE_KEY: ${{ inputs.service_key }}
          REQUEST_DOCS_REPOSITORY: ${{ inputs.docs_repository }}
          REQUEST_DESCRIPTION: ${{ inputs.description }}
          REQUEST_ISSUE_URL: ${{ inputs.issue_url }}
          PYTHONPATH: src
        run: >-
          python -m otc_agent.cli plan
          --service "$REQUEST_SERVICE_KEY"
          --description "$REQUEST_DESCRIPTION"
          --docs-repository "$REQUEST_DOCS_REPOSITORY"
          --issue-url "$REQUEST_ISSUE_URL"
          --output build/change-plan.json
      - name: Export validated fields
        id: fields
        run: |
          python -c 'import json; p=json.load(open("build/change-plan.json")); print("sdk="+p["mapping"]["sdk"]); print("provider="+p["mapping"]["provider"]); print("docs="+p["mapping"]["docs"]); print("kind="+p["classification"]["kind"]); print("bootstrap="+str(p["mapping"]["bootstrap"]).lower())' >> "$GITHUB_OUTPUT"
          python -c 'import json; p=json.load(open("build/change-plan.json")); c=p["classification"]; print(f"## Classification: `{c['"'"'kind'"'"']}` ({c['"'"'confidence'"'"']})")' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-plan-${{ github.run_id }}
          path: |
            build/change-plan.json
            build/offline-eval.json
          if-no-files-found: error
          retention-days: 90

  generate:
    needs: intake
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: sdk-proposal
    outputs:
      base_sha: ${{ steps.revisions.outputs.sdk }}
    steps:
      - name: Check out automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - name: Check out SDK base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud/gophertelekomcloud
          path: workspace/sdk
          persist-credentials: false
      - name: Check out API reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud-docs/${{ needs.intake.outputs.docs }}
          path: workspace/docs
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: workspace/sdk/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-plan-${{ github.run_id }}
          path: evidence
      - name: Capture immutable source revisions
        id: revisions
        run: |
          echo "sdk=$(git -C workspace/sdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "docs=$(git -C workspace/docs rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate and validate SDK candidate
        env:
          OTC_MODEL_PROVIDER: copilot
          OTC_MODEL_NAME: ${{ vars.OTC_MODEL_NAME }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: >-
          uv run --project automation --frozen python -m otc_agent.cli generate-sdk
          --plan evidence/build/change-plan.json
          --sdk-root workspace/sdk
          --docs-root workspace/docs
          --output-dir generated
      - name: Upload verified SDK patch and evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-candidate-${{ github.run_id }}
          path: |
            generated/sdk.patch
            generated/sdk-evidence.json
            evidence/build/change-plan.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [intake, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sdk-publish
    steps:
      - name: Mint repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OTC_APP_ID }}
          private-key: ${{ secrets.OTC_APP_PRIVATE_KEY }}
          owner: opentelekomcloud
          repositories: gophertelekomcloud
      - name: Check out automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - name: Check out exact SDK base with App identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud/gophertelekomcloud
          ref: ${{ needs.generate.outputs.base_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: workspace/sdk
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-candidate-${{ github.run_id }}
          path: candidate
      - name: Verify candidate digest and path scope
        env:
          PYTHONPATH: automation/src
          SERVICE: ${{ needs.intake.outputs.sdk }}
        run: |
          python -c 'import hashlib,json; e=json.load(open("candidate/generated/sdk-evidence.json")); p=open("candidate/generated/sdk.patch","rb").read(); assert hashlib.sha256(p).hexdigest()==e["patch_sha256"]'
          python -m otc_agent.cli validate-patch --stage sdk --service "$SERVICE" --patch candidate/generated/sdk.patch
      - name: Apply, commit, push, and open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          KIND: ${{ needs.intake.outputs.kind }}
          SERVICE: ${{ needs.intake.outputs.sdk }}
          DESCRIPTION: ${{ inputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git -C workspace/sdk switch -c "agent/${KIND}-${SERVICE}-${GITHUB_RUN_ID}"
          git -C workspace/sdk apply --check "$GITHUB_WORKSPACE/candidate/generated/sdk.patch"
          git -C workspace/sdk apply "$GITHUB_WORKSPACE/candidate/generated/sdk.patch"
          git -C workspace/sdk diff --check
          git -C workspace/sdk config user.name "${APP_SLUG}[bot]"
          git -C workspace/sdk config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git -C workspace/sdk add --all
          git -C workspace/sdk commit -m "${SERVICE}: ${KIND} generated API support"
          git -C workspace/sdk push --set-upstream origin HEAD
          python automation/scripts/render_pr_body.py --plan candidate/evidence/build/change-plan.json --evidence candidate/generated/sdk-evidence.json --run-url "$RUN_URL" --output candidate/pr-body.md
          title=$(python -c 'import os; print(f"[{os.environ['"'"'SERVICE'"'"'].upper()}] {os.environ['"'"'KIND'"'"']}: {os.environ['"'"'DESCRIPTION'"'"'][:120]}")')
          url=$(gh pr create --repo opentelekomcloud/gophertelekomcloud --base main --head "agent/${KIND}-${SERVICE}-${GITHUB_RUN_ID}" --draft --title "$title" --body-file candidate/pr-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## SDK draft PR: $url" >> "$GITHUB_STEP_SUMMARY"
