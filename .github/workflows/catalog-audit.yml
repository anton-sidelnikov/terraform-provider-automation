name: Documentation catalog audit

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
          cache: ""
      - name: Compare reviewed catalog with api-ref marker discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_catalog.py
      - name: Add discovery report to the workflow summary
        if: always()
        run: |
          echo '## Documentation API discovery' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/catalog-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-audit-${{ github.run_id }}
          path: build/catalog-audit.json
          if-no-files-found: error
          retention-days: 30
