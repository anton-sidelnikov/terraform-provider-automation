name: Generate provider pull request

on:
  workflow_dispatch:
    inputs:
      sdk_pr_number:
        description: Merged agent-generated gophertelekomcloud PR number
        required: true
        type: number
      docs_repository:
        description: Exact repository slug in opentelekomcloud-docs
        required: true
        type: string
      service_key:
        description: Same service key used by the SDK workflow
        required: false
        type: string
      description:
        description: Same API change description used by the SDK workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-change-${{ inputs.docs_repository }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12.11"
  GO_VERSION: "1.23"
  PYTHONHASHSEED: "0"

jobs:
  verify-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sdk_sha: ${{ steps.sdk.outputs.sha }}
      sdk_pr_url: ${{ steps.sdk.outputs.url }}
      sdk: ${{ steps.fields.outputs.sdk }}
      provider: ${{ steps.fields.outputs.provider }}
      docs: ${{ steps.fields.outputs.docs }}
      kind: ${{ steps.fields.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - name: Recreate and independently classify plan
        env:
          PYTHONPATH: src
          REQUEST_SERVICE_KEY: ${{ inputs.service_key }}
          REQUEST_DOCS_REPOSITORY: ${{ inputs.docs_repository }}
          REQUEST_DESCRIPTION: ${{ inputs.description }}
        run: >-
          python -m otc_agent.cli plan
          --service "$REQUEST_SERVICE_KEY"
          --description "$REQUEST_DESCRIPTION"
          --docs-repository "$REQUEST_DOCS_REPOSITORY"
          --output build/change-plan.json
      - name: Fetch and verify merged SDK PR
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.sdk_pr_number }}
        run: |
          gh api "repos/opentelekomcloud/gophertelekomcloud/pulls/${PR_NUMBER}" > build/sdk-pr.json
          python scripts/verify_sdk_pr.py --pull-request build/sdk-pr.json --plan build/change-plan.json >> "$GITHUB_OUTPUT"
      - name: Export validated fields
        id: fields
        run: |
          python -c 'import json; p=json.load(open("build/change-plan.json")); print("sdk="+p["mapping"]["sdk"]); print("provider="+p["mapping"]["provider"]); print("docs="+p["mapping"]["docs"]); print("kind="+p["classification"]["kind"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-plan-${{ github.run_id }}
          path: |
            build/change-plan.json
            build/sdk-pr.json
          if-no-files-found: error
          retention-days: 90

  generate:
    needs: verify-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: provider-after-sdk-approval
    outputs:
      base_sha: ${{ steps.revisions.outputs.provider }}
    steps:
      - name: Check out automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - name: Check out provider base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud/terraform-provider-opentelekomcloud
          path: workspace/provider
          persist-credentials: false
      - name: Check out approved SDK merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud/gophertelekomcloud
          ref: ${{ needs.verify-sdk.outputs.sdk_sha }}
          path: workspace/sdk
          persist-credentials: false
      - name: Check out API reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud-docs/${{ needs.verify-sdk.outputs.docs }}
          path: workspace/docs
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: workspace/provider/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-plan-${{ github.run_id }}
          path: evidence
      - name: Capture immutable provider base
        id: revisions
        run: echo "provider=$(git -C workspace/provider rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate and validate provider candidate
        env:
          PYTHONPATH: automation/src
          OTC_MODEL_BASE_URL: ${{ vars.OTC_MODEL_BASE_URL }}
          OTC_MODEL_NAME: ${{ vars.OTC_MODEL_NAME }}
          OTC_MODEL_API_KEY: ${{ secrets.OTC_MODEL_API_KEY }}
          OTC_MODEL_INPUT_USD_PER_MILLION: ${{ vars.OTC_MODEL_INPUT_USD_PER_MILLION }}
          OTC_MODEL_OUTPUT_USD_PER_MILLION: ${{ vars.OTC_MODEL_OUTPUT_USD_PER_MILLION }}
        run: >-
          python -m otc_agent.cli generate-provider
          --plan evidence/build/change-plan.json
          --provider-root workspace/provider
          --sdk-root workspace/sdk
          --docs-root workspace/docs
          --sdk-revision "${{ needs.verify-sdk.outputs.sdk_sha }}"
          --sdk-pr-url "${{ needs.verify-sdk.outputs.sdk_pr_url }}"
          --output-dir generated
      - name: Upload verified provider patch and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-candidate-${{ github.run_id }}
          path: |
            generated/provider.patch
            generated/provider-evidence.json
            evidence/build/change-plan.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [verify-sdk, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: provider-publish
    steps:
      - name: Mint repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OTC_APP_ID }}
          private-key: ${{ secrets.OTC_APP_PRIVATE_KEY }}
          owner: opentelekomcloud
          repositories: terraform-provider-opentelekomcloud
      - name: Check out automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: automation
          persist-credentials: false
      - name: Check out exact provider base with App identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opentelekomcloud/terraform-provider-opentelekomcloud
          ref: ${{ needs.generate.outputs.base_sha }}
          token: ${{ steps.app-token.outputs.token }}
          path: workspace/provider
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ""
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provider-candidate-${{ github.run_id }}
          path: candidate
      - name: Verify candidate digest and path scope
        env:
          PYTHONPATH: automation/src
          SERVICE: ${{ needs.verify-sdk.outputs.provider }}
        run: |
          python -c 'import hashlib,json; e=json.load(open("candidate/generated/provider-evidence.json")); p=open("candidate/generated/provider.patch","rb").read(); assert hashlib.sha256(p).hexdigest()==e["patch_sha256"]'
          python -m otc_agent.cli validate-patch --stage provider --allow-dependency-files --service "$SERVICE" --patch candidate/generated/provider.patch
      - name: Apply, commit, push, and open draft PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          KIND: ${{ needs.verify-sdk.outputs.kind }}
          SERVICE: ${{ needs.verify-sdk.outputs.provider }}
          DESCRIPTION: ${{ inputs.description }}
          SDK_PR_URL: ${{ needs.verify-sdk.outputs.sdk_pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git -C workspace/provider switch -c "agent/${KIND}-${SERVICE}-${GITHUB_RUN_ID}"
          git -C workspace/provider apply --check "$GITHUB_WORKSPACE/candidate/generated/provider.patch"
          git -C workspace/provider apply "$GITHUB_WORKSPACE/candidate/generated/provider.patch"
          git -C workspace/provider diff --check
          git -C workspace/provider config user.name "${APP_SLUG}[bot]"
          git -C workspace/provider config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git -C workspace/provider add --all
          git -C workspace/provider commit -m "${SERVICE}: ${KIND} generated provider support"
          git -C workspace/provider push --set-upstream origin HEAD
          python automation/scripts/render_pr_body.py --plan candidate/evidence/build/change-plan.json --evidence candidate/generated/provider-evidence.json --run-url "$RUN_URL" --sdk-pr-url "$SDK_PR_URL" --output candidate/pr-body.md
          title=$(python -c 'import os; print(f"[{os.environ['"'"'SERVICE'"'"'].upper()}] {os.environ['"'"'KIND'"'"']}: {os.environ['"'"'DESCRIPTION'"'"'][:120]}")')
          url=$(gh pr create --repo opentelekomcloud/terraform-provider-opentelekomcloud --base main --head "agent/${KIND}-${SERVICE}-${GITHUB_RUN_ID}" --draft --title "$title" --body-file candidate/pr-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Provider draft PR: $url" >> "$GITHUB_STEP_SUMMARY"
