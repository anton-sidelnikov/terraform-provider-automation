[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "otc-provider-agent"
version = "0.1.0"
description = "Governed SDK-first agentic workflow for the OpenTelekomCloud Terraform provider"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenTelekomCloud automation maintainers" }]
dependencies = [
    "github-copilot-sdk==1.0.9",
    "psycopg[binary]==3.2.10",
    "pymysql==1.1.2",
    "python-dotenv==1.1.1",
]

[project.scripts]
otc-agent = "otc_agent.cli:main"
otc-agent-api = "otc_agent.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/otc_agent"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]
